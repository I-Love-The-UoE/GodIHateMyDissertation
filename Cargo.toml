[workspace]
resolver = "3"
members = [
    "crates/gihmd-core",
    "crates/gihmd-fetch",
    "crates/gihmd-git",
    "crates/gihmd-process",
    "crates/gihmd-pty",
    "crates/gihmd-secrets",
    "crates/gihmd-watch",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
gihmd-core = { path = "crates/gihmd-core" }
gihmd-fetch = { path = "crates/gihmd-fetch" }
gihmd-git = { path = "crates/gihmd-git" }
gihmd-process = { path = "crates/gihmd-process" }
gihmd-pty = { path = "crates/gihmd-pty" }
gihmd-secrets = { path = "crates/gihmd-secrets" }
gihmd-watch = { path = "crates/gihmd-watch" }

base64 = "0.23.1"
dunce = "1.0.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
git2 = { version = "0.21.0", default-features = false, features = ["ssh", "https", "vendored-libgit2"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
libc = "0.2.190"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "charset", "system-proxy"] }
# NOTE: `ring` ships prebuilt assembly, so Windows runners need no NASM; aws-lc-rs would.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.3", features = ["protocol-asset"] }
tauri-build = "2.7.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
# NOTE: `tracing-log` is deliberately off: tauri-plugin-log owns the `log` facade for the frontend.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that fight docs/style/rust.md §11 (comments are minimal).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

# Restriction lints that encode docs/style/rust.md §1.3 and §7.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
map_err_ignore = "warn"
exit = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cfg_not_test = "warn"
str_to_string = "warn"
mem_forget = "warn"
infinite_loop = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
